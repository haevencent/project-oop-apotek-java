name: Run App
on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: javac -d out -cp "lib/*" src/model/*.java src/App.java
      - name: Run
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: java -cp "out:lib/*" App
